function drawCross(in_ctx, in_length, in_width, in_color, in_angle) {
	const drawLine = () => {
		in_ctx.beginPath();
		in_ctx.moveTo(in_length / 2 * -1, 0);
		in_ctx.lineTo(in_length / 2 * +1, 0);
		in_ctx.stroke();
	};
	const w = in_ctx.canvas.width / 2;
	const h = in_ctx.canvas.height / 2;
	// common
	in_ctx.lineCap = 'round';
	in_ctx.lineWidth = in_width;
	in_ctx.strokeStyle = in_color;
	// 1st line
	in_ctx.save();
	in_ctx.translate(w, h);
	in_ctx.rotate(in_angle);
	drawLine();
	// 2nd line
	in_ctx.save();
	in_ctx.rotate(Math.PI / 2);
	drawLine();
	in_ctx.restore();
	in_ctx.restore();
}

function gray(in_ratio) {
	const ratio = Math.min(1, Math.max(0, in_ratio));
	const level = Math.round(255 * ratio);
	return 'rgb(' + level + ',' + level + ',' + level + ')';
}

function drawGradCross(in_ctx, in_length, in_width, in_angle) {
	in_ctx.fillStyle = 'white';
	in_ctx.fillRect(0, 0, in_ctx.canvas.width, in_ctx.canvas.height);
	in_ctx.globalCompositeOperation = 'multiply';
	const steps = Math.floor(in_width / 2);
	for (let i = 0; i < steps; i++) {
		const color = gray(1 - i / (steps - 1));
		drawCross(in_ctx, in_length - i * 2, in_width - i * 2, color, in_angle);
	}
}

const textureFactory = factoryBuilder((in_w, in_h) => {
	const canvas = document.createElement('CANVAS');
	canvas.width = in_w;
	canvas.height = in_h;
	const ctx = canvas.getContext('2d');
	const length = Math.min(in_w, in_h) * 0.7;
	const width = 6;
	const angle = Math.PI;
	drawGradCross(ctx, length, width, angle);
	return (new THREE.TextureLoader()).load(canvas.toDataURL());
});

const materialFactory = factoryBuilder((in_color, in_size, in_dmz) => {
	const material = new THREE.MeshLambertMaterial();
	material.color = new THREE.Color(in_color);
	if (in_dmz) {
		material.map = textureFactory.create(in_size, in_size);
		material.map.wrapS = THREE.ClampToEdgeWrapping;
		material.map.wrapT = THREE.ClampToEdgeWrapping;
		material.map.repeat.set(0.02, 0.02);
		material.map.offset.set(0.5, 0.5);
	}
	return material;
});

function updateTorusPiece(in_structure, in_piece, in_deltaAngle, in_row, in_col) {
	const poloidalAngle = in_structure.locationToRowAngle(in_row, in_col) + in_deltaAngle;
	const knowledge = in_structure.knowledgeByPoloidalAngle(poloidalAngle);
	updateChamferedGeometry(
		in_piece.geometry,
		knowledge.tWidth,
		knowledge.bWidth,
		knowledge.height,
		knowledge.rotation
	);
	in_piece.position.copy(in_structure.position(poloidalAngle, in_structure.toroidalAngle(in_col)));
	in_piece.quaternion.copy(in_structure.locationToQuaternion(in_row, in_col));
}

let gTypeParamIsInvalid = false;

const gCyclicLevels = ((in_diameter) => {
	const topologyMap = new Map([
		['hexFlatTopped', {
			factory : angleSharedHexmapFactory,
			offset : 1
		}],
		['square', {
			factory : angleSharedSquareFactory,
			offset : -1
		}]
	]);
	const conf = {
		rZoom : 1.2,
		tWeight : 0.5,
		minorRatio : 0.5
	};
	const levelArr = (in_type => {
		const board = BOARD_DB.find(in_board => in_board.type === in_type);
		if (!board) {
			gTypeParamIsInvalid = true;
			const defaultIndex = 0;
			return BOARD_DB[defaultIndex].levels;
		} else {
			return board.levels;
		}
	})(getParam('type'));
	const uniqueNameSet = new Set();
	const values = new cCyclicValues();
	levelArr.forEach(in_level => {
		const topology = topologyMap.get(in_level.format);
		const rows = in_level.table.length;
		const cols = Math.max(...in_level.table.map(row => row.length));
		const majorRadius = in_diameter / 2 * conf.rZoom;
		const minorRadius = majorRadius * conf.minorRatio;
		const unitSize = 2 * minorRadius * Math.tan(Math.PI / rows);
		const unitThick = unitSize * conf.tWeight;
		const st = new cTorusStructure(
			rows,
			cols,
			majorRadius,
			minorRadius,
			unitSize,
			topology.offset
		);
		const pieces = [];
		const tubeRatio = (minorRadius - unitThick) / minorRadius;
		const torusRatio = (majorRadius - minorRadius) / (majorRadius - minorRadius + unitThick);
		const innerRatio = Math.min(tubeRatio, torusRatio);
		for (let row = 0; row < st.rows; row++) {
			for (let col = 0; col < st.cols; col++) {
				const initialPoloidalAngle = st.locationToRowAngle(row, col);
				const geometry = topology.factory.create(
					unitSize,
					innerRatio,
					unitThick,
					initialPoloidalAngle
				);
				const color = in_level.table[row][col];
				const useTexture = (color === D) ? true : false;
				const materials = [
					materialFactory.create(color, unitSize, useTexture),
					materialFactory.create(BGCOLOR, unitSize, false)
				];
				const piece = new THREE.Mesh(geometry, materials);
				updateTorusPiece(st, piece, 0, row, col);
				pieces.push(piece);
			}
		}
		const colorSet = new Set(in_level.table.flat());
		colorSet.delete(D);
		colorSet.delete(E);
		const emptyCnt = in_level.table.flat().filter(in_color => in_color === E).length;
		let name = 'vs ';
		if (colorSet.size > 2) {
			name += (colorSet.size - 1) + 'NPC';
		} else {
			let argo;
			for (const color of colorSet) {
				if (color !== B) {
					argo = gColoredArgo.get(color);
				}
			}
			name += argo.charAt(0).toUpperCase() + argo.slice(1);
		}
		name += ' (' + emptyCnt + ')';
		if (uniqueNameSet.has(name)) {
			name += ' mirrored';
		}
		uniqueNameSet.add(name);
		const dmzRow = in_level.table.some(in_row => in_row.every(in_color => in_color === D));
		const dmzCol = in_level.table[0].some((in_color, in_ix) => in_level.table.every(in_row => in_row[in_ix] === D));
		values.push({
			name : name,
			loop : {
				row : !dmzRow,
				col : !dmzCol
			},
			format : in_level.format,
			structure : st,
			colorArr : Array.from(colorSet),
			pieces : pieces
		});
	});
	return values;
})(COLONY_SIZE);

/*
	the cColonyBoard represents a game-specific board.
*/

class cColonyBoard extends cColony {
	getColorTable() {
		const table = [];
		const st = this.currPiecesCache.structure;
		for (let row = 0; row < st.rows; row++) {
			table[row] = [];
			for (let col = 0; col < st.cols; col++) {
				const piece = this.locationToPiece(row, col);
				table[row].push(getShellColor(piece));
			}
		}
		return table;
	}
	changedPieces(in_table) {
		const changedArr = [];
		for (let row = 0; row < in_table.length; row++) {
			for (let col = 0; col < in_table[row].length; col++) {
				const piece = this.locationToPiece(row, col);
				const currColor = getShellColor(piece);
				const nextColor = in_table[row][col];
				if (currColor !== nextColor) {
					changedArr.push({
						piece : piece,
						curr : currColor,
						next : nextColor
					});
				}
			}
		}
		return changedArr;
	}
	slidableDistance(in_piece, in_sign) {
		// can not slide in cColonyBoard
		return 0;
	}
	bobRotation = false;
	rotate(in_group, in_axis, in_rad) {
		super.rotate(in_group, in_axis, in_rad);
		if (!this.bobRotation) {
			return;
		}
		const max = 1.2;
		const scalar = (createPeriodicCos(this.currPiecesCache.structure.rowsAngle, 1, max, true))(in_rad);
		in_group.children.forEach(in_child => {
			const basePos = in_child.userData.tmpCache.position;
			in_child.position.copy(basePos.clone().multiplyScalar(scalar));
			in_child.position.x = basePos.x;
		});
	}
	makeRotateProgress(in_col, in_delta, in_ending_callback) {
		this.uiDisable();
		const last = this.currPiecesCache.structure.rowsAngle * in_delta;
		const pieces = this.children.filter(in_child => this.pieceToLocation(in_child).col === in_col);
		const group = this.setupGroup(pieces);
		return this.makeAnimationProgress(group, cColony.axes.x, 0, last, in_ratio => {
			if (in_ratio < 1) {
				return;
			}
			this.uiEnable();
			(in_ending_callback)();
		});
	}
	static #views = {
		TORUSVIEW : Symbol(),
		T_TO_C : Symbol(),
		C_TO_T : Symbol(),
		CYLINDERVIEW : Symbol(),
		C_TO_P : Symbol(),
		P_TO_C : Symbol(),
		PLANEVIEW : Symbol()
	};
	static #viewTransitions = {
		[cColonyBoard.#views.TORUSVIEW] : {
			toPlaneView : cColonyBoard.#views.T_TO_C
		},
		[cColonyBoard.#views.T_TO_C] : {
			toPlaneView : cColonyBoard.#views.CYLINDERVIEW
		},
		[cColonyBoard.#views.C_TO_T] : {
			toTorusView : cColonyBoard.#views.TORUSVIEW
		},
		[cColonyBoard.#views.CYLINDERVIEW] : {
			toPlaneView : cColonyBoard.#views.C_TO_P,
			toTorusView : cColonyBoard.#views.C_TO_T
		},
		[cColonyBoard.#views.C_TO_P] : {
			toPlaneView : cColonyBoard.#views.PLANEVIEW
		},
		[cColonyBoard.#views.P_TO_C] : {
			toTorusView : cColonyBoard.#views.CYLINDERVIEW
		},
		[cColonyBoard.#views.PLANEVIEW] : {
			toTorusView : cColonyBoard.#views.P_TO_C
		}
	};
	#state = cColonyBoard.#views.TORUSVIEW;
	#transition(in_action) {
		const state = cColonyBoard.#viewTransitions[this.#state][in_action];
		if (state) {
			this.#state = state;
		} else {
			throw new Error('invalid transition : ' + in_action);
		}
	}
	get isTorusView() {
		return (this.#state === cColonyBoard.#views.TORUSVIEW);
	}
	get isPlaneView() {
		return (this.#state === cColonyBoard.#views.PLANEVIEW);
	}
	#createCylinderPieces() {
		const torus = this.currPiecesCache.structure;
		const rows = torus.rows;
		const cols = torus.cols;
		const radius = torus.minorRadius;
		const conf = {
			mWeight : 0.1,
			tWeight : 0.5
		};
		const circumference = 2 * Math.PI * radius;
		const marginRow = circumference / rows * conf.mWeight;
		const unitSize = circumference / rows - marginRow;
		const unitThick = unitSize * conf.tWeight;
		const source = this.locationToPiece(0, 0);
		const isHex = source.geometry.userData.cornerCnt === 6;
		const marginCol = isHex ? hexColMargin(unitSize / Math.sqrt(3), marginRow) : marginRow;
		const colsDelta = unitSize + marginCol;
		const cylinder = new cCylinderStructure(
			rows,
			cols,
			VEC3(colsDelta * (cols - 1) / 2, radius, 0),
			colsDelta * -1,
			torus.offset,
			torus.crossSectionRotation - Math.PI / 2
		);
		const geometryFactory = isHex ? allSharedHexmapFactory : allSharedSquareFactory;
		const geometry = geometryFactory.create(unitSize, (radius - unitThick) / radius, unitThick);
		const pieces = [];
		for (let row = 0; row < rows; row++) {
			for (let col = 0; col < cols; col++) {
				const original = this.locationToPiece(row, col);
				const piece = new THREE.Mesh(geometry, original.material);
				piece.position.copy(cylinder.locationToPosition(row, col));
				piece.quaternion.copy(cylinder.locationToQuaternion(row, col));
				pieces.push(piece);
			}
		}
		return {structure : cylinder, pieces : pieces};
	}
	#setupCylinderMorph() {
		this.cylinder = this.#createCylinderPieces();
		this.restore = new Map();
		this.children.forEach((in_piece, in_ix) => {
			const targetPiece = this.cylinder.pieces[in_ix];
			const original = in_piece.geometry;
			const geometry = original.clone();
			const source = geometry.attributes.position;
			const target = targetPiece.geometry.attributes.position.clone();
			for (let i = 0; i < source.count; i++) {
				const v = VEC3().fromBufferAttribute(source, i);
				v.applyQuaternion(in_piece.quaternion).add(in_piece.position);
				source.setXYZ(i, v.x, v.y, v.z);
				v.fromBufferAttribute(target, i);
				v.applyQuaternion(targetPiece.quaternion).add(targetPiece.position);
				target.setXYZ(i, v.x, v.y, v.z);
			}
			source.needsUpdate = true;
			target.needsUpdate = true;
			geometry.morphAttributes.position = [target];
			geometry.morphTargetsRelative = false;
			this.restore.set(in_piece, {
				geometry : original,
				position : in_piece.position.clone(),
				quaternion : in_piece.quaternion.clone()
			});
			in_piece.geometry = geometry;
			in_piece.position.set(0, 0, 0);
			in_piece.quaternion.identity();
			in_piece.updateMorphTargets();
			in_piece.morphTargetInfluences[0] = 0;
		});
	}
	#makeTorusProgress(in_toOverview, in_duration, in_ending_callback) {
		const views = cColonyBoard.#views;
		const action = in_toOverview ? 'toPlaneView' : 'toTorusView';
		if (in_toOverview) {
			this.#setupCylinderMorph();
			this.uiDisable();
		} else {
			this.children.forEach(in_piece => {
				const data = this.restore.get(in_piece);
				in_piece.geometry = data.morphGeometry;
				in_piece.position.set(0, 0, 0);
				in_piece.quaternion.identity();
				in_piece.updateMorphTargets();
				in_piece.morphTargetInfluences[0] = 1;
			});
		}
		this.#transition(action);
		const ease = new cEase(0, 1, in_duration);
		let completed = false;
		return () => {
			if (completed) {
				return;
			}
			const amount = ease.currentEasingOut();
			const ratio = in_toOverview ? amount : 1 - amount;
			this.children.forEach(in_piece => {
				in_piece.morphTargetInfluences[0] = ratio;
			});
			if (amount === 1) {
				completed = true;
				this.#transition(action);
				if (in_toOverview) {
					this.children.forEach((in_piece, in_ix) => {
						const data = this.restore.get(in_piece);
						const target = this.cylinder.pieces[in_ix];
						data.morphGeometry = in_piece.geometry;
						in_piece.geometry = target.geometry;
						in_piece.position.copy(target.position);
						in_piece.quaternion.copy(target.quaternion);
						in_piece.updateMatrixWorld(true);
					});
				} else {
					this.children.forEach(in_piece => {
						const data = this.restore.get(in_piece);
						in_piece.geometry.dispose();
						in_piece.geometry = data.geometry;
						in_piece.position.copy(data.position);
						in_piece.quaternion.copy(data.quaternion);
						in_piece.updateMatrixWorld(true);
					});
					delete this.restore;
					delete this.cylinder;
					this.uiEnable();
				}
				(in_ending_callback)();
			}
		};
	}
	#makePlaneProgress(in_toOverview, in_duration, in_ending_callback) {
		const action = in_toOverview ? 'toPlaneView' : 'toTorusView';
		const init = {
			amount : 0,
			position : new Map(),
			quaternion : new Map()
		};
		const last = {
			amount : 1,
			position : new Map(),
			quaternion : new Map()
		};
		this.children.forEach(in_child => {
			init.position.set(in_child, in_child.position.clone());
			init.quaternion.set(in_child, in_child.quaternion.clone());
		});
		let endingProcess;
		if (in_toOverview) {
			this.#transition(action);
			const st = this.cylinder.structure;
			this.children.forEach((in_child, in_ix) => {
				const row = Math.floor(in_ix / st.cols);
				const col = in_ix % st.cols;
				last.position.set(in_child, st.locationToOverviewPosition(row, col));
				last.quaternion.set(in_child, st.locationToOverviewQuaternion(row, col));
			});
			endingProcess = () => {
				this.cache = init;
				this.#transition(action);
			};
		} else {
			this.#transition(action);
			this.children.forEach(in_child => {
				last.position.set(in_child, this.cache.position.get(in_child));
				last.quaternion.set(in_child, this.cache.quaternion.get(in_child));
			});
			endingProcess = () => {
				delete this.cache;
				this.#transition(action);
			};
		}
		const ease = new cEase(init.amount, last.amount, in_duration);
		let completed = false;
		return () => {
			if (completed) {
				return;
			}
			const amount = ease.currentEasingOut();
			this.children.forEach(in_child => {
				const p0 = init.position.get(in_child);
				const q0 = init.quaternion.get(in_child);
				const p1 = last.position.get(in_child);
				const q1 = last.quaternion.get(in_child);
				in_child.position.copy(p0).lerp(p1, amount);
				in_child.quaternion.copy(q0).slerp(q1, amount);
				in_child.updateMatrixWorld(true);
			});
			if (amount === last.amount) {
				completed = true;
				(endingProcess)();
				(in_ending_callback)();
			}
		};
	}
	makeSwitchViewProgress(in_toOverview, in_duration, in_ending_callback) {
		let func1st, func2nd;
		if (in_toOverview) {
			if (this.isTorusView) {
				func1st = this.#makeTorusProgress;
				func2nd = this.#makePlaneProgress;
			} else {
				return;
			}
		} else {
			if (this.isPlaneView) {
				func1st = this.#makePlaneProgress;
				func2nd = this.#makeTorusProgress;
			} else {
				return;
			}
		}
		let transforming = true;
		let progress = func1st.call(this, in_toOverview, in_duration, () => {
			progress = func2nd.call(this, in_toOverview, in_duration, () => transforming = false);
		});
		return () => {
			if (transforming) {
				(progress)();
			} else {
				(in_ending_callback)();
			}
		};
	}
}

/*
	gWorld (cSphericalWorld)
		|
		+-- gColony (cColonyBoard)
			|
			+-- gColony.children <--- gCyclicLevels[n].pieces

	gController (cGameController) : knows the internal structure of the following instances
		|
		+-- gReversi (cReversi) : used for npc algorithm
		|
		+-- gColony : used for user interface
		|
		+-- gWorld : used for animation
*/

const gColony = new cColonyBoard();

const WORLD_RADIUS = COLONY_SIZE * 10;
const WORLD_INIT_ZOOM = WORLD_RADIUS / 2;

const gWorld = new cSphericalWorld(WORLD_RADIUS);
gWorld.add(gColony);
gWorld.moveView(0.5, 0.5);
gWorld.motionZoom2(WORLD_INIT_ZOOM, 1000);

let gController = null;
let gReversi = null;

class cGameController {
	static #UNUSED = -1;
	#mapping;
	#turnHook = () => {};
	#curIndex = 0;
	#pcColor;
	enableHandler = false;
	// cGameController knows the internal structure of cColonyBoard, cReversi and cSphericalWorld
	constructor(in_colorArr, in_pcColor) {
		this.#pcColor = in_pcColor;
		this.#mapping = new Array(10).fill(cGameController.#UNUSED);
		for (let i = 0; i < in_colorArr.length; i++) {
			this.#mapping[i] = in_colorArr[i];
		}
		// 8, 9 are declared as follows in cReversi
		this.#mapping[8] = DMZCOLOR;
		this.#mapping[9] = EMPTYCOLOR;
	}
	curNPCStrategy() {
		return gColoredArgo.get(this.#mapping[this.#curIndex]);
	}
	setTurnHook(in_hook) {
		this.#turnHook = in_hook;
	}
	#execTurnHook() {
		const color = this.#mapping[this.#curIndex];
		this.enableHandler = (color === this.#pcColor);
		(this.#turnHook)(this.#curIndex, color, this.enableHandler);
	}
	#incrementIndex() {
		this.#curIndex++;
		if (this.#mapping[this.#curIndex] === cGameController.#UNUSED) {
			this.#curIndex = 0;
		}
	}
	endTurn(in_reversi = null) {
		this.#incrementIndex();
		const cond = in_reversi.getCurrentCondition();
		if (cond.finished) {
			// all players can not do anything
			const winner = cond.players.reduce((in_accum, in_curVal, in_curIndex, in_arr) => {
				return in_curVal.score > in_arr[in_accum].score ? in_curIndex : in_accum;
			}, 0);
			return this.#mapping[winner];
		} else {
			while (true) {
				const {dead, frozen, score} = cond.players[this.#curIndex];
				if (dead || (frozen && !in_reversi.rotatableFixedCol())) {
					// curIndex can not do anything
					this.#incrementIndex();
				} else {
					break;
				}
			}
			// to prevent stack overflow
			setTimeout(() => this.#execTurnHook(), 0);
			// in this context, no winner
			return -1;
		}
	}
	start() {
		this.#execTurnHook();
	}
	end() {
		this.setTurnHook(() => {});
		this.#mapping.fill(cGameController.#UNUSED);
	}
	static #update(in_changedArr) {
		in_changedArr.forEach(in_changed => {
			setShellColor(in_changed.piece, in_changed.next);
		});
	}
	static #updateDynamic(in_changedArr, in_world) {
		// in_changedArr : see cColonyBoard.changedPieces()
		in_changedArr.forEach(in_changed => {
			// backup initial value
			in_changed.initRotationX = in_changed.piece.rotation.x;
		});
		const ease = new cEase(0, Math.PI * 2, 500);
		return new Promise(in_resolved => {
			let updated = false;
			const hook = () => {
				const angle = ease.currentEasingOut();
				if (angle === Math.PI * 2) {
					in_world.removeAnimationHook(hook);
					in_changedArr.forEach(in_changed => {
						// restore initial value
						in_changed.piece.rotation.x = in_changed.initRotationX;
					});
					/*
						execute the process that follows the await (or callback defined in then),
						which corresponds to the then block of a promise
					*/
					(in_resolved)();
					return;
				}
				if ((angle > Math.PI) && (!updated)) {
					SE_MOVED.play();
					cGameController.#update(in_changedArr);
					updated = true;
				}
				in_changedArr.forEach(in_changed => {
					in_changed.piece.rotation.x = in_changed.initRotationX + angle;
				});
			};
			in_world.addAnimationHook(hook);
		});
	}
	#makeChangedArr(in_reversi, in_colony) {
		const indexTable = in_reversi.getTable();
		const colorTable = indexTable.map(in_row => in_row.map(in_cell => this.#mapping[in_cell]));
		// this can handle smaller table than colony
		return in_colony.changedPieces(colorTable);
	}
	reversiToColony(in_reversi, in_colony) {
		const changedArr = this.#makeChangedArr(in_reversi, in_colony);
		cGameController.#update(changedArr);
	}
	async reversiToColonyDynamic(in_reversi, in_colony, in_world) {
		const changedArr = this.#makeChangedArr(in_reversi, in_colony);
		await cGameController.#updateDynamic(changedArr, in_world);
	}
	convertColonyTable(in_colony) {
		const reverse = {};
		this.#mapping.forEach((in_value, in_ix) => {
			reverse[in_value] = in_ix;
		});
		let table = in_colony.getColorTable();
		return table.map(in_row => in_row.map(in_cell => reverse[in_cell]));
	}
	async moveViewTo(in_piece, in_world) {
		const cameraPos = in_world.getCameraPos();
		const angleX = Math.atan2(cameraPos.y, cameraPos.z) - Math.atan2(in_piece.position.y, in_piece.position.z);
		const vec3 = cameraPos.applyMatrix4((new THREE.Matrix4()).makeRotationX(angleX));
		await in_world.motionViewFrom(vec3, 500);
	}
	async #playLastAction(in_reversi, in_colony, in_world) {
		const last = in_reversi.getLast();
		switch (last.action) {
		case 'choose-item' :
			const piece = in_colony.locationToPiece(last.row, last.col);
			await this.moveViewTo(piece, in_world);
			// choose
			setShellColor(piece, this.#mapping[last.who]);
			await this.reversiToColonyDynamic(in_reversi, in_colony, in_world);
			break;
		case 'fixed-col-rotate' :
			console.log('rotating', last);
			await (async ()=> {
				return new Promise(in_resolve => {
					const hook = in_colony.makeRotateProgress(last.col, last.delta, () => {
						in_world.removeAnimationHook(hook);
						(in_resolve)();
					});
					in_world.addAnimationHook(hook);
				});
			})();
			break;
		default :
			break;
		}
	}
	async npc(in_reversi, in_colony, in_world) {
		const player = this.#curIndex;
		if (in_reversi.playAutomatically(player, this.curNPCStrategy())) {
			const threshold = 100;
			const max = cReversi.maximizedRecMap.get(player) ?? 0;
			if (max > threshold) {
				const scriptArr = ['Too easy', 'Pathetic', 'So predictable'];
				gFigure.shortSpeak(scriptArr[arrRand]());
				cReversi.maximizedRecMap.set(player, 0);
			}
			await this.#playLastAction(in_reversi, in_colony, in_world);
			return true;
		} else {
			// can't do anything
			return false;
		}
	}
	async pcChoose(in_piece, in_reversi, in_colony, in_world) {
		const resume = this.enableHandler;
		this.enableHandler = false;
		const {row, col} = in_colony.pieceToLocation(in_piece);
		const result = in_reversi.playSetPosition(this.#curIndex, row, col);
		if (result) {
			SE_BEEP.play();
			await this.#playLastAction(in_reversi, in_colony, in_world);
		}
		this.enableHandler = resume;
		return result;
	}
	pcRotate(in_reversi, in_colony) {
		const tblPrev = in_reversi.getTable();
		const tblNext = this.convertColonyTable(in_colony);
		// find rotated col
		const col = tblPrev[0].findIndex((in_val, in_col) => tblPrev.some((in_arr, in_row) => in_arr[in_col] !== tblNext[in_row][in_col]));
		const arrPrev = tblPrev.map(in_arr => in_arr[col]);
		const arrNext = tblNext.map(in_arr => in_arr[col]);
		// decide delta
		const delta = (arrNext.join('') + arrNext.join('')).indexOf(arrPrev.join(''));
		in_reversi.playRotate(this.#curIndex, 'fixed-col-rotate', col, delta);
	}
	async pcUndo(in_reversi, in_colony, in_world) {
		if (!this.enableHandler) {
			return false;
		}
		if (in_reversi.playUndo(this.#curIndex)) {
			await this.reversiToColonyDynamic(in_reversi, in_colony, in_world);
			return true;
		} else {
			return false;
		}
	}
}

class cWarpLine {
	static #speed = 10;
	static #gradation = 10;
	constructor(in_canvas) {
		const w = in_canvas.width;
		const h = in_canvas.height;
		this.ctx = in_canvas.getContext('2d');
		this.box = new THREE.Box2(
			new THREE.Vector2(0, 0),
			new THREE.Vector2(w, h)
		);
		this.from = new THREE.Vector2(w / 2, h / 2);
		this.#reset();
	}
	#reset() {
		const angle = Math.random() * Math.PI * 2;
		this.direction = new THREE.Vector2(Math.cos(angle), Math.sin(angle));
		this.speed = Math.random() * cWarpLine.#speed + 5;
		this.length = 0;
	}
	#curVec(in_scalar) {
		return this.from.clone().add(this.direction.clone().multiplyScalar(in_scalar));
	}
	#drawGrayLine(in_from, in_to, in_grayScale) {
		this.ctx.strokeStyle = COLOR.sGray(in_grayScale);
		this.ctx.beginPath();
		this.ctx.moveTo(in_from.x, in_from.y);
		this.ctx.lineTo(in_to.x, in_to.y);
		this.ctx.stroke();
	}
	update() {
		this.length += this.speed;
		const to = this.#curVec(this.length);
		if (this.box.containsPoint(to)) {
			const notch = this.length / cWarpLine.#gradation;
			for (let i = 0; i < cWarpLine.#gradation; i++) {
				this.#drawGrayLine(
					this.#curVec(notch * i),
					this.#curVec(notch * (i + 1)),
					255 / cWarpLine.#gradation * (i + 1)
				);
			}
		} else {
			/*
				*** NOTE ***
				even if overwritung using black,
				this.#drawGrayLine(this.from, to, 0x00);
				smudge of white line will remain.
			*/
			this.#reset();
		}
	}
}

function warpViewProgress(in_canvas, in_lineCount) {
	const warpLines = [];
	for (let i = 0; i < in_lineCount; i++) {
		warpLines.push(new cWarpLine(in_canvas));
	}
	return () => {
		warpLines.forEach(in_line => {
			in_line.update();
		});
	}
}

function complete(in_player) {
	gController.end();
	gFigure.hide();
	gChart.hide();
	const progress = warpViewProgress(gBackgroundCanvas, 50);
	gWorld.addAnimationHook(progress);
	const duration = 2000;
	gWorld.motionZoom2(WORLD_RADIUS * 1.5, duration * 0.9);
	setTimeout(() => {
		const {players} = gReversi.getCurrentCondition();
		let scores = players.filter(in_player => in_player.score > 0).map(in_player => in_player.score);
		gWorld.removeAnimationHook(progress);
		const dialog = document.createElement('div');
		Object.assign(dialog.style, {
			width : 'auto',
			height : 'auto',
			color : 'white',
			background : 'black',
			borderRadius : '1em',
			padding : '1.5em'
		});
		([
			'<div>Winner is ...</div>',
			'<div style="text-align:center"><img src="' + FIGURES.get(in_player) + '" /></div>',
			'<div>The result is ' + scores.join(' vs ') + '.</div>',
			'<div>Thanks to your wisdom, peace in the universe has been preserved.</div>',
			'<div>Click to go next stage.</div>',
		]).forEach(in_fragment => {
			dialog.innerHTML += in_fragment;
		});
		startDialog(dialog, async () => {
			drawCosmicView(gBackgroundCanvas, 400, 50);
			await nextLevel(false);
			gWorld.motionZoom2(WORLD_INIT_ZOOM, 1000);
		});
	}, duration);
}

const gFigure = (() => {
	const container = document.createElement('DIV');
	document.body.appendChild(container);
	const figure = {
		width : 100,
		from : {
			r : 20,
			b : 20
		}
	}
	const maxInt = 2 ** 31 - 1;
	Object.assign(container.style, {

		bottom : figure.from.b + 'px',

		height : 'auto',

	});

			width : 'auto',

		});

	})());
	// figure speak
	const _speak = in_displayTime => {

			width : figure.width + 50,

			vertical : figure.from.b + 100,

		});

		}

const PC_COLOR = BLUE;

function poloidalRotateTorus(in_structure, in_colony, in_deltaAngle) {
	for (let row = 0; row < in_structure.rows; row++) {
		for (let col = 0; col < in_structure.cols; col++) {
			const piece = in_colony.locationToPiece(row, col);
			updateTorusPiece(in_structure, piece, in_deltaAngle, row, col);
		}
	}
	in_structure.crossSectionRotation += in_deltaAngle;
}

function initialPoloidalRotation() {
	const st = gColony.currPiecesCache.structure;
	const lastAngle = Math.PI / 4 * -1;
	const ease = new cEase(0, lastAngle, 1000);
	let prevAngle = 0;
	const progress = () => {
		const currAngle = ease.currentEasingOut();
		poloidalRotateTorus(st, gColony, currAngle - prevAngle);
		prevAngle = currAngle;
		if (currAngle === lastAngle) {
			gWorld.removeAnimationHook(progress);
			gController.enableHandler = true;
		}
	};
	gController.enableHandler = false;
	gWorld.addAnimationHook(progress);
}

function initializeByLevel() {
	const curr = gCyclicLevels.currValue();
	const edge = {
		row : !(curr.loop.row),
		col : !(curr.loop.col),
	};
	gController = new cGameController(curr.colorArr, PC_COLOR);
	gChart.initialize(curr.colorArr);
	const pcIndex = curr.colorArr.indexOf(PC_COLOR);
	const table = gController.convertColonyTable(gColony);
	const st = curr.structure;
	if (st.offset >= 0) {
		gReversi = new cReversi(table, edge.row, edge.col, curr.format, st.offset);
	} else {
		gReversi = new cReversi(table, edge.row, edge.col, curr.format);
	}
	gController.setTurnHook(async (in_player, in_color, in_pc) => {
		const name = gController.curNPCStrategy() ?? 'you';
		gFigure.show(FIGURES.get(in_color), name);
		updateChart();
		if (in_pc) {
			const last = gReversi.getLast({who : pcIndex, action : 'choose-item'});
			if (last) {
				const piece = gColony.locationToPiece(last.row, last.col);
				await gController.moveViewTo(piece, gWorld);
			}
			if (!gReversi.flippable(in_player)) {
				gFigure.longSpeak('I can rotate cylinder.');
			}
			return;
		}
		await gController.npc(gReversi, gColony, gWorld);
		const winner = gController.endTurn(gReversi);
		if (winner < 0) {
			return;
		}
		complete(winner);
	});
	gController.reversiToColony(gReversi, gColony);
	gController.start();
	if (gTypeParamIsInvalid) {
		menu();
		gTypeParamIsInvalid = false;
	}
}

class cOcupiedChart extends cChart {
	static #r = 45;
	#colorNamesOrder = [];
	constructor() {
		const w = cOcupiedChart.#r * 2, h = w;
		super(w, h, 'circle');
	}
	initialize(in_playerColorNums) {
		const chartColorNums = [...in_playerColorNums, EMPTYCOLOR];
		this.#colorNamesOrder = chartColorNums.map(in_color => '#' + in_color.toString(16).padStart(6, '0'));
		const empty = this.#colorNamesOrder[this.#colorNamesOrder.length - 1];
		const initColorNames = {};
		initColorNames[empty] = 1;
		this.update(initColorNames);
	}
	hide() {
		this.canvas.style.visibility = 'hidden';
	}
	show() {
		this.canvas.style.visibility = 'visible';
	}
	update(in_nextColorNums) {
		const colorNames = {};
		this.#colorNamesOrder.forEach(in_colorName => {
			if (Object.hasOwn(in_nextColorNums, in_colorName)) {
				colorNames[in_colorName] = in_nextColorNums[in_colorName];
			} else {
				colorNames[in_colorName] = 0;
			}
		});
		super.update(colorNames);
		this.show();
 	}
}

function drawCosmicView(in_canvas, in_stars, in_nebulae_patterns, in_color = 0x000064) {
	const ctx = in_canvas.getContext('2d');
	const w = in_canvas.width;
	const h = in_canvas.height;
	ctx.fillStyle = 'black';
	ctx.fillRect(0, 0, w, h);
	for (let i = 0; i < in_nebulae_patterns; i++) {
		const x = Math.random() * w;
		const y = Math.random() * h;
		const r = Math.random() * 100 + 50;
		const gradient = ctx.createRadialGradient(x, y, 0, x, y, r);
		gradient.addColorStop(0, COLOR.sRGBA(in_color, 127));
		gradient.addColorStop(1, COLOR.sRGBA(in_color, 0));
		ctx.beginPath();
		ctx.arc(x, y, r, 0, Math.PI * 2, false);
		ctx.fillStyle = gradient;
		ctx.fill();
	}
	for (let i = 0; i < in_stars; i++) {
		const x = Math.random() * w;
		const y = Math.random() * h;
		const r = Math.random() * 1;
		ctx.beginPath();
		ctx.arc(x, y, r, 0, Math.PI * 2, false);
		ctx.fillStyle = 'white';
		ctx.fill();
	}
}

const gBackgroundCanvas = document.createElement('CANVAS');

function setupBody(in_document) {
	if (!in_document.body) {
		in_document.documentElement.appendChild(in_document.createElement('BODY'));
	}
	Object.assign(in_document.body.style, {
		margin : '0',
		overflow : 'hidden'
	});
}

function createChildWindow(in_document) {
	return new Promise(in_callback => {
		setupBody(in_document);
		const iframe = in_document.createElement('iframe');
		in_document.body.appendChild(iframe);
		Object.assign(iframe.style, {
			width: '100%',
			height: '100%',
			border: 'none'
		});
		/*
			*** NOTE ***
			although Chrome can use iframe.contentDocument right after createElement,
			Firefox can not use it ant needs to use asynchronous process.
			by the way, if you use not timer but load event,
			your code will not work for Chrome.
		*/
		setTimeout(() => {
			setupBody(iframe.contentDocument);
			(in_callback)(iframe.contentWindow);
		}, 0);
	});
}

document.addEventListener('DOMContentLoaded', (async () => {
	/*
		*** NOTE ***
		without iframe (outer window),
		geometry in event will be wrong because of google ads
	*/
	const outer = await createChildWindow(document);
	let resizeWorld = in_ev => {
		gWorld.resize(outer.innerWidth, outer.innerHeight);
		gBackgroundCanvas.width = outer.innerWidth;
		gBackgroundCanvas.height = outer.innerHeight;
		drawBackground(gBackgroundCanvas);
	};
	outer.addEventListener('resize', debouncing(resizeWorld, 300));
	outer.dispatchEvent(new Event('resize'));
	outer.document.body.appendChild(gWorld.canvas);
	outer.document.body.appendChild(gBackgroundCanvas);
	gWorld.start();
}));

})();

const focusHere = (() => {
	let focusedEmpty = null;
	const HIGHLIGHT = (new THREE.Color(EMPTYCOLOR)).lerp(new THREE.Color(0xFFFFFF), 0.3).getHex();
	return in_ndc => {
		let current = null
		let color = -1;
		if (in_ndc != null) {
			let intersects = gWorld.intersectPositive(in_ndc);
			if (intersects.length > 0) {
				current = intersects[0].object;
				color = getShellColor(current);
			}
		}
		if ((color === EMPTYCOLOR) || (color === HIGHLIGHT)) {
			if (current === focusedEmpty) {
				return;
			}
			setShellColor(current, HIGHLIGHT);
			if (focusedEmpty) {
				setShellColor(focusedEmpty, EMPTYCOLOR);
			}
			focusedEmpty = current;
		} else {
			if (focusedEmpty) {
				setShellColor(focusedEmpty, EMPTYCOLOR);
			}
			focusedEmpty = null;
		}
	}
})();

function resetFocus() {

function rotateDone() {

async function chooseHere(in_ev) {
	const ndc = ndcFromEvent(in_ev);
	let intersects = gWorld.intersectPositive(ndc);
	if (intersects.length === 0) {
		return;
	}
	resetFocus();
	const curr = intersects[0].object;
	if (getShellColor(curr) !== EMPTYCOLOR) {
		knock();
	} else {
		if (await gController.pcChoose(curr, gReversi, gColony, gWorld)) {
			const winner = gController.endTurn(gReversi);
			if (winner < 0) {
				return;
			}
			complete(winner);
		} else {
			knock();
		}
	}
}

(() => {
	const closure = {
		x : -1,
		y : -1,
		poloidal : null,
		once : false
	};
	const start = in_ev => {
		if (!closure.once) {
			/*
				*** NOTE ***
				Safari may restrict sound without user interaction.
				because of this, the sound does not work without this code.
			*/
			SE_DUMMY.play();
			closure.once = true;
		}
		const ndc = ndcFromEvent(in_ev);
		const intersects = gWorld.intersectPositive(ndc);
		if (intersects.length === 0) {
			return;
		}
		resetFocus();
		closure.x = in_ev.clientX;
		closure.y = in_ev.clientY;
		const drag = intersects[0].object
		if (getShellColor(drag) === PC_COLOR) {
			// tactical rotation
			//★
			return;
			if (gReversi.rotatableFixedCol()) {
				gColony.uiSetInitPosition(intersects[0].point, ndcToAbs(ndc));
			}
		} else {
			// all rotation = poloidal rotation
			const st = gColony.currPiecesCache.structure;
			const {row, col} = gColony.pieceToLocation(drag);
			const origin = gColony.localToWorld(st.locationToPosition(row, col));
			const tangent = st.poloidalTangent(row, col).transformDirection(gColony.matrixWorld);
			closure.poloidal = {
				projectedDir : gWorld.projectedDir(origin, tangent).normalize(),
				startPos : ndcToAbs(ndc),
				currAngle : 0
			};
		}
	};
	const move = thresholding(in_ev => {
		closure.x = -1;
		closure.y = -1;
		if (closure.poloidal) {
			const st = gColony.currPiecesCache.structure;
			const delta = ndcToAbs(ndcFromEvent(in_ev)).sub(closure.poloidal.startPos);
			const sensitivity = 2.0;
			const angle = delta.dot(closure.poloidal.projectedDir) * sensitivity;
			const deltaAngle = angle - closure.poloidal.currAngle;
			poloidalRotateTorus(st, gColony, deltaAngle);
			closure.poloidal.currAngle = angle;
		} else {
			const ndc = ndcFromEvent(in_ev);
			if (gColony.uiIsMoving()) {
				if (gColony.uiUpdatePosition(ndcToAbs(ndc))) {
					SE_MOVED.play();
				}
			} else {
				if (gColony.uiIsDragging()) {
					notifyDelta(ndc);
				} else {
					if (!in_ev[isEmulated]) {
						focusHere(ndc);
					}
				}
			}
		}
	});
	const stop = in_ev => {
		if (closure.poloidal) {
			closure.poloidal = null;
		} else {
			const releaseProgress = gColony.uiRelease(in_changed => {
				gWorld.removeAnimationHook(releaseProgress);
				if (in_changed) {
					rotateDone();
				}
			});
			if (releaseProgress) {
				gWorld.addAnimationHook(releaseProgress);
				return;
			}
		}
		if ((closure.x === in_ev.clientX) && (closure.y === in_ev.clientY)) {
			chooseHere(in_ev);
		}
	};
	let handlers = {
		'mousedown' : start,
		'mousemove' : move,
		'mouseleave' : stop,
		'mouseout' : stop,
		'mouseup' : stop
	};
	for (let [eventName, handler] of Object.entries(handlers)) {
		gWorld.canvas.addEventListener(eventName, in_ev => {
			if (gController?.enableHandler && gColony.isTorusView) {
				(handler)(in_ev);
			}
		});
	}
})();
